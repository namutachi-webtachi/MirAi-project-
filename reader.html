<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Google Font cho chế độ Cổ điển -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b81">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc truyện</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="exit-focus-btn" onclick="toggleFocusMode()">❌ Thoát Tập Trung (ESC)</div>
    <div id="progress-bar"></div>
    <div id="loading">Đang tải truyện...</div>

    <div class="container">
           
<!-- Toolbar -->
<div class="glass-box reader-controls" style="position: sticky; top: 10px; z-index: 99;">
    <!-- Bên trái: Nút Home -->
    <a href="index.html" class="btn btn-outline">⬅ Trang chủ</a>

    <!-- Bên phải: Các nút chức năng -->
    <div style="display: flex; gap: 10px;">
        <!-- 1. Nút Focus (Đưa ra ngoài cho tiện bấm) -->
        <button class="btn btn-outline" onclick="toggleFocusMode()" title="Chế độ tập trung">
            👁️ Focus
        </button>

        <!-- 2. Nút Cài đặt & Popup -->
        <div style="position: relative;">
            <button class="btn" onclick="toggleSettings()">⚙️ Cài đặt</button>
            
            <!-- Popup Cài đặt (Đã bỏ nút Focus thừa ở trong này đi) -->
            <div id="settings-panel" class="settings-panel">
                <p style="margin: 0 0 10px 0; font-weight: bold;">Cỡ chữ:</p>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button class="btn" style="flex:1" onclick="changeFontSize('down')">A-</button>
                    <button class="btn" style="flex:1" onclick="changeFontSize('up')">A+</button>
                </div>
                
                <p style="margin: 10px 0 10px 0; font-weight: bold;">Font chữ:</p>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button class="btn btn-outline" onclick="changeFont('sans-serif')" style="flex: 1;">Hiện đại</button>
                    <button class="btn btn-outline" onclick="changeFont('serif')" style="flex: 1;">Cổ điển</button>
                </div>
                
                <hr style="border-color: var(--border); margin: 10px 0;">
                <button class="btn" onclick="toggleTheme()" style="width: 100%">Đổi chế độ Sáng/Tối</button>
            </div>
        </div>
    </div>
</div>

  

        <!-- Nội dung -->
        <div class="glass-box">
            <h2 id="chap-title" style="text-align: center; color: var(--primary);"></h2>
            <div id="content-area"></div>
        </div>

        <!-- Điều hướng -->
        <div class="glass-box reader-controls">
            <button id="prev-btn" class="btn">⬅ Chương trước</button>
            <button id="next-btn" class="btn">Chương sau ➡</button>
        </div>

        <!-- Bình luận -->
        <div class="glass-box">
            <h3>💬 Bình luận & Cảm xúc</h3>
            <div id="comments"></div>
        </div>
    </div>
    <!-- PWA Service Worker Register -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/MirAi-project-/sw.js').then(registration => {
                console.log('SW registered: ', registration);
            }).catch(registrationError => {
                console.log('SW registration failed: ', registrationError);
            });
        });
    }
</script>
    

    <script src="config.js"></script>
    <script src="js/script.js"></script>
    <div id="bgm-player" onclick="toggleBGM()">
    <div id="bgm-icon"></div>
    <div id="bgm-controls">▶️</div>
</div>
    <!-- FOOTER XỊN SÒ: ĐẾM VIEW + SOCIAL -->
<footer style="text-align: center; margin-top: 50px; padding: 20px; background: rgba(255,255,255,0.8); border-radius: 20px 20px 0 0;">
    
    <!-- Các nút mạng xã hội -->
    <div style="margin-bottom: 15px;">
        <a id="fb-link" href="#" target="_blank" style="text-decoration: none; margin: 0 10px; color: #1877F2; font-weight: bold; font-size: 1.2rem;">
            <i class="fab fa-facebook"></i> Facebook
        </a>
        <a id="dc-link" href="#" target="_blank" style="text-decoration: none; margin: 0 10px; color: #5865F2; font-weight: bold; font-size: 1.2rem;">
            <i class="fab fa-discord"></i> Discord
        </a>
    </div>

    <!-- Bộ đếm lượt xem (Tự động chạy) -->
    <div style="font-size: 0.9rem; color: #666;">
        <span>👀 Lượt truy cập: <span id="busuanzi_value_site_pv" style="font-weight: bold; color: var(--primary);">...</span></span>
        <span style="margin: 0 10px;">|</span>
        <span>👤 Người đọc: <span id="busuanzi_value_site_uv" style="font-weight: bold; color: var(--primary);">...</span></span>
    </div>

    <p style="font-size: 0.8rem; opacity: 0.7;">&copy;  MirAi Project - NamuTachi</p>
</footer>

<!-- Script đếm view (Busuanzi) -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<!-- Script lấy link social từ config -->
<script>
    if(typeof CONFIG !== 'undefined') {
        document.getElementById('fb-link').href = CONFIG.social.facebook;
        document.getElementById('dc-link').href = CONFIG.social.discord;
    }
</script>
<!-- Thêm Icon FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
